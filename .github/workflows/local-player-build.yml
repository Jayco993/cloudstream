name: Build Local Player APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Make gradlew executable
        run: chmod +x gradlew
      - uses: gradle/actions/setup-gradle@v4
      - name: Build stable release APK (signed with debug key)
        run: ./gradlew assembleStableRelease --no-daemon
      - name: Record exact source
        run: |
          echo "commit: $(git rev-parse HEAD)" | tee build-info.txt
          ls -la app/build/outputs/apk/stable/release/ | tee -a build-info.txt
      - uses: actions/upload-artifact@v4
        with:
          name: CS-LocalPlayer-APK
          path: |
            app/build/outputs/apk/stable/release/*.apk
            build-info.txt
      - name: Publish as GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: local-player-${{ github.run_number }}
          name: CS Local Player build ${{ github.run_number }}
          body: "Built from commit ${{ github.sha }} (CloudStream v4.9.1 + local-player patch)."
          files: app/build/outputs/apk/stable/release/*.apk
